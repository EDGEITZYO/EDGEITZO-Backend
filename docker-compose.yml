version: "3.8"

networks:
  backend-network:
    driver: bridge

services:
  app:
    build: .
    container_name: edgeitzo-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: edgeitzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped


  postgres:
    image: postgres:15
    container_name: edgeitzo-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: edgeitzo-chromadb
    expose:
      - "8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "chroma run --help > /dev/null 2>&1 && exit 0 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 30s
    networks:
      - backend-network
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: edgeitzo-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:

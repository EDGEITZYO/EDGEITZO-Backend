version: "3.8"

networks:
  backend-network:
    driver: bridge

services:
  app:
    build: .
    container_name: edgeitzo-app
    volumes:
      - ./data:/app/data
      # BGE-m3-ko(2.1GB)는 첫 검색 때 받아온다. 볼륨으로 빼두지 않으면 컨테이너
      # 쓰기 레이어에 들어가서 배포로 컨테이너가 교체될 때마다 다시 받는다
      # (실측: 다운로드+로드 36초, 그 뒤 첫 인코딩 4.3초).
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: edgeitzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped


  postgres:
    image: postgres:15
    container_name: edgeitzo-postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeitzo -d edgeitzo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: edgeitzo-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "chroma run --help > /dev/null 2>&1 && exit 0 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 30s
    networks:
      - backend-network
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: edgeitzo-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  redis_data:
  hf_cache:

version: "3.8"

services:
  redis:
    image: redis:7
    container_name: papergraph-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: papergraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password1234
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:15
    container_name: papergraph-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-edgeitzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-edgeitzo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: papergraph-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  celery_worker:
    build: .
    container_name: papergraph-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      # host.docker.internal = macOS 호스트 → 로컬 Homebrew Redis(비밀번호 있음)와 동일한 인스턴스 사용
      CELERY_BROKER_URL: redis://:120809@host.docker.internal:6379/1
      CELERY_RESULT_BACKEND: redis://:120809@host.docker.internal:6379/2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  neo4j_data:
  postgres_data:
  chroma_data:

name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/EDGEITZO-Backend
            git pull origin main

            # 1. 교체 전 현재 이미지를 backup 태그로 고정 (build가 latest를 덮어쓰기 전에)
            docker tag edgeitzo-backend-app:latest edgeitzo-backend-app:backup || true

            # 2. 새 이미지 빌드 (실패 시 여기서 중단, 기존 컨테이너는 계속 서비스 중)
            docker-compose build || { echo "빌드 실패, 배포 중단"; exit 1; }

            # 3. DB 마이그레이션 (컨테이너 교체 전에 스키마 먼저 반영, -T로 비대화형 처리, 실패 시 중단)
            docker-compose run --rm -T app alembic upgrade head || { echo "마이그레이션 실패, 배포 중단"; exit 1; }

            # 4. 컨테이너 교체 (이미지 바뀐 서비스만 재생성, DB/redis는 안 건드림)
            docker-compose up -d --remove-orphans

            # 5. 정상 확인 후 안 쓰는 이미지 정리 (backup은 태그 있어서 대상 제외됨)
            docker image prune -f

            # 6. 빌드 캐시 정리. image prune은 캐시를 안 건드려서 배포마다 쌓이기만 했다
            #    (2026-08-31 기준 12.05GB 누적, 디스크의 절반). 최근 7일치는 다음 빌드
            #    속도를 위해 남긴다.
            docker builder prune -f --filter until=168h
